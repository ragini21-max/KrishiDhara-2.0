<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Farmer Portal</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gradient-to-br from-green-50 via-emerald-50 to-teal-100 min-h-screen p-6 md:p-12 flex flex-col justify-between">
<header class="bg-green-700 text-white p-5 rounded-3xl flex justify-between items-center max-w-4xl w-full mx-auto gap-4"><div class="flex items-center gap-3"><span class="text-4xl">👨‍🌾</span><h1 class="font-bold">KrishiDhara 2.0 • Farmer</h1></div>
<div class="flex gap-3"><select id="langSelect" onchange="changeLanguage()" class="bg-green-800 text-white text-sm px-3 py-2 rounded-2xl border border-green-600 font-bold"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="pa">ਪੰਜਾਬੀ</option><option value="gu">ગુજરાતી</option><option value="bn">বাংলা</option><option value="te">తెలుగు</option><option value="ta">தமிழ்</option><option value="kn">ಕನ್ನಡ</option><option value="ml">മലയാളം</option><option value="or">ଓଡ଼ିଆ</option><option value="as">অসমীয়া</option><option value="ur">اردو</option><option value="sa">संस्कृतम्</option><option value="ne">नेपाली</option><option value="sd">سنڌي</option><option value="ks">कॉशुर</option><option value="doi">डोगरी</option><option value="mni">মৈতৈলোন্</option><option value="sat">संताली</option><option value="bho">भोजपुरी</option><option value="raj">राजस्थानी</option></select><button onclick="switchRole()" class="bg-green-800 px-4 py-2 rounded-2xl border border-green-600 font-bold text-sm">Switch Role</button></div></header>
<main class="max-w-4xl mx-auto my-8 space-y-8 w-full">
<div class="bg-white p-6 rounded-3xl border-2 border-green-200 flex justify-between items-center"><h2 class="text-xl font-extrabold">Step 1: Aadhaar Verification</h2><span id="stepBadge" class="text-sm bg-amber-100 px-4 py-1 rounded-full font-bold">Pending</span></div>
<div class="bg-white p-8 rounded-3xl shadow-xl border-2 border-green-200 space-y-8">
<div id="mobileSection" class="space-y-4"><label class="font-bold">📱 Mobile Number</label><div class="flex gap-4"><input id="mobileInput" maxlength="10" placeholder="10-digit mobile" class="flex-1 bg-gray-50 border-2 rounded-2xl px-5 py-4"><button onclick="sendMobileOTP()" class="bg-green-600 text-white px-8 py-4 rounded-2xl font-bold">Send OTP</button></div><div id="mobileOtpBox" class="hidden space-y-4 pt-5 border-t"><div class="flex justify-between"><span>Enter OTP</span><span id="mobileTimer" class="text-red-600 font-bold">60s</span></div><div class="flex gap-4"><input id="mobileOtpInput" maxlength="4" placeholder="••••" class="w-40 border-2 rounded-2xl px-5 py-4 text-center text-xl font-bold"><button onclick="verifyMobileOTP()" class="flex-1 bg-emerald-600 text-white py-4 rounded-2xl font-bold">Verify ✅</button></div></div></div>
<div id="aadhaarSection" class="space-y-4 pt-6 border-t-2 opacity-50 pointer-events-none"><label class="font-bold">🆔 Aadhaar (12-Digit)</label><div class="flex gap-4"><input id="aadhaarInput" maxlength="12" type="password" placeholder="XXXX XXXX XXXX" class="flex-1 bg-gray-50 border-2 rounded-2xl px-5 py-4"><button onclick="sendAadhaarOTP()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold">Send e-KYC OTP</button></div><div id="aadhaarOtpBox" class="hidden space-y-4 pt-5 border-t"><div class="flex justify-between"><span>Aadhaar OTP</span><span id="aadhaarTimer" class="text-red-600 font-bold">60s</span></div><div class="flex gap-4"><input id="aadhaarOtpInput" maxlength="4" placeholder="••••" class="w-40 border-2 rounded-2xl px-5 py-4 text-center text-xl font-bold"><button onclick="verifyAadhaarOTP()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold">Verify & Fetch 🔍</button></div></div></div>
<div id="profileCard" class="hidden p-6 bg-green-50 border-2 border-green-500 rounded-2xl"><h3 class="font-extrabold text-green-900">Ramesh Kumar - Verified ✅</h3></div>
</div><button id="btnProceedSlot" onclick="proceedToSlotBooking()" disabled class="w-full bg-gray-300 text-gray-600 font-bold py-5 rounded-2xl cursor-not-allowed">Proceed to Slot Booking →</button></main>
<script>
let mOTP="",aOTP="",mInt=null,aInt=null;
function startTimer(d,id){let t=d;const it=setInterval(()=>{document.getElementById(id).textContent=t+"s";if(--t<0){clearInterval(it);document.getElementById(id).textContent="Expired";}},1000);if(id==='mobileTimer'){if(mInt)clearInterval(mInt);mInt=it;}else{if(aInt)clearInterval(aInt);aInt=it;}}
function sendMobileOTP(){const m=document.getElementById('mobileInput').value.trim();if(m.length!==10){alert("Enter valid 10-digit");return;}mOTP=Math.floor(1000+Math.random()*9000).toString();alert("OTP: "+mOTP);document.getElementById('mobileOtpBox').classList.remove('hidden');startTimer(60,'mobileTimer');}
function verifyMobileOTP(){if(document.getElementById('mobileOtpInput').value.trim()===mOTP){alert("Mobile verified");document.getElementById('mobileOtpBox').classList.add('hidden');document.getElementById('mobileInput').disabled=true;document.getElementById('aadhaarSection').classList.remove('opacity-50','pointer-events-none');}else alert("Wrong OTP - Hint: "+mOTP);}
function sendAadhaarOTP(){const a=document.getElementById('aadhaarInput').value.trim();if(a.length!==12){alert("Enter 12-digit");return;}aOTP=Math.floor(1000+Math.random()*9000).toString();alert("e-KYC OTP: "+aOTP);document.getElementById('aadhaarOtpBox').classList.remove('hidden');startTimer(60,'aadhaarTimer');}
function verifyAadhaarOTP(){if(document.getElementById('aadhaarOtpInput').value.trim()===aOTP){document.getElementById('profileCard').classList.remove('hidden');document.getElementById('stepBadge').innerText="Verified ✅";document.getElementById('stepBadge').className="bg-green-100 text-green-800 px-4 py-1 rounded-full font-bold";const b=document.getElementById('btnProceedSlot');b.disabled=false;b.className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-5 rounded-2xl cursor-pointer";}else alert("Wrong OTP - Hint: "+aOTP);}
function proceedToSlotBooking(){localStorage.setItem('kd_farmer_verified','true');localStorage.setItem('kd_farmer_name','Ramesh Kumar');location.href='slot_booking.html';}
function changeLanguage(){localStorage.setItem('kd_selected_lang',document.getElementById('langSelect').value);}
window.addEventListener('DOMContentLoaded',()=>{const s=localStorage.getItem('kd_selected_lang')||'en';const d=document.getElementById('langSelect');if(d)d.value=s;});
function switchRole(){location.href='../index.html';}
</script></body></html>
